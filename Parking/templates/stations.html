<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV Stations</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
  * {
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    margin: 0;
    background: linear-gradient(135deg, #0f172a, #06b6d4);
    padding: 20px;
  }

  h2 {
    text-align: center;
    color: white;
    margin-bottom: 20px;
  }

  .container {
    max-width: 1100px;
    margin: auto;
  }

  /* Map Card */
  .map-card {
    background: white;
    padding: 15px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    margin-bottom: 20px;
  }

  #map {
    height: 400px;
    border-radius: 10px;
  }

  /* Stations Grid */
  .stations {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
  }

  .station-card {
    background: white;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    transition: 0.3s;
  }

  .station-card:hover {
    transform: translateY(-5px);
  }

  .station-card h3 {
    margin-top: 0;
    color: #2563eb;
  }

  .coords {
    font-size: 13px;
    color: #666;
  }

  .button {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 14px;
    background: #22c55e;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    transition: 0.3s;
  }

  .button:hover {
    background: #16a34a;
  }

  .empty {
    text-align: center;
    background: white;
    padding: 20px;
    border-radius: 10px;
  }

</style>
</head>

<body>

<h2>⚡ EV Charging Stations Near You</h2>

<div class="container">

  <!-- Map -->
  <div class="map-card">
    <div id="map"></div>
  </div>

  {% if stations|length == 0 %}
    <div class="empty">
      <p>🚫 No stations found nearby your location.</p>
    </div>
  {% else %}

    <div class="stations">
      {% for s in stations %}
      <div class="station-card">
        <h3>{{ s.name }}</h3>
        <p class="coords">📍 Lat: {{ s.latitude }}, Lon: {{ s.longitude }}</p>
        <a class="button" href="/slots/{{ s.id }}">⚡ View Slots</a>
      </div>
      {% endfor %}
    </div>

  {% endif %}

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  var map = L.map("map").setView([16.506, 80.648], 12);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap contributors",
  }).addTo(map);

  var stations = {{ stations|tojson }};

  stations.forEach(s => {
    L.marker([s.latitude, s.longitude])
      .addTo(map)
      .bindPopup(s.name);
  });

});
</script>

</body>
</html>
