<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Stations</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            background: linear-gradient(135deg, #0f172a, #2563eb);
            color: #333;
        }

        h2 {
            text-align: center;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        /* Map */
        #map {
            height: 350px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* Station cards */
        .station-card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .station-card:hover {
            transform: translateY(-5px);
        }

        .station-card h3 {
            margin-top: 0;
            color: #2563eb;
        }

        .station-card p {
            font-size: 14px;
            color: #555;
        }

        /* Button */
        .button {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 18px;
            background: #22c55e;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .button:hover {
            background: #16a34a;
            transform: scale(1.05);
        }

        /* Empty state */
        .empty {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

    </style>
</head>

<body>

<h2>⚡ EV Charging Stations Near You</h2>

<div class="container">

    <div id="map"></div>

    {% if stations|length == 0 %}
        <div class="empty">
            <p>🚫 No stations found nearby your location.</p>
        </div>
    {% endif %}

    {% for s in stations %}
    <div class="station-card">
        <h3>📍 {{ s.name }}</h3>
        <p>Latitude: {{ s.latitude }}</p>
        <p>Longitude: {{ s.longitude }}</p>
        <a class="button" href="/slots/{{ s.id }}">⚡ View Slots</a>
    </div>
    {% endfor %}

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    var map = L.map('map').setView([16.506, 80.648], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: "© OpenStreetMap contributors"
    }).addTo(map);

    var stations = {{ stations|tojson }};

    stations.forEach(function(s){
        L.marker([s.latitude, s.longitude])
            .addTo(map)
            .bindPopup(s.name);
    });
</script>

</body>
</html>
